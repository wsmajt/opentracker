version: "2"

run:
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable:
        - printf
        - structtag
        - unreachable
      disable:
        - shadow
    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - errcheck
          - govet

      # Exclude known false positives
      - text: "should have a package comment"
        linters:
          - revive
      - text: "at least one file in a package should have a package comment"
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
